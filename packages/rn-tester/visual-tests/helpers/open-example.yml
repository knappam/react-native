appId: ${APP_ID} # iOS: com.meta.RNTester.localDevelopment | Android: com.facebook.react.uiapp
---
- launchApp:
    stopApp: true
# Android drops a deep link that arrives before RNTester is ready. iOS can
# restore another screen on relaunch, so it doesn't wait for the home screen.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: 'Components'
          timeout: 30000
- openLink: ${EXAMPLE_URL}
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Open'
          optional: true
